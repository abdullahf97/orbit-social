<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Orbit</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0c;
        --surface: #131318;
        --line: #262630;
        --text: #f5f2ea;
        --muted: #a4a4b1;
        --accent: #ff6b4a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at top, rgba(255, 107, 74, 0.12), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        color: #1c0b06;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        font-weight: 400;
        margin: 0 0 8px;
      }
      p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
      a {
        display: inline-block;
        margin-top: 20px;
        background: var(--accent);
        color: #1c0b06;
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        padding: 10px 18px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">◍</div>
      <h1>You're off the grid</h1>
      <p>
        Orbit keeps your feed on this device, but this page was never cached.
        Reconnect and try again — anything you queued will send automatically.
      </p>
      <a href="/feed">Try again</a>
    </div>
  </body>
</html>
